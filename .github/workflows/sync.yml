name: sync
on:
  schedule:
    # Odd hours: the live scope (619 projects).
    - cron: "17 1-23/2 * * *"
    # Even hours: everything, so archived and dormant projects stay mirrored
    # and their archived bit keeps tracking GitLab.
    - cron: "17 0-22/2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "max repos to process (0 = all)"
        default: "450"
      dry_run:
        type: boolean
        default: false
      only:
        description: "GitLab path to sync alone, e.g. applications/calamares"
        default: ""
      max_age_days:
        description: "skip projects untouched for N days (0 = no age limit)"
        default: "730"
      include_stale:
        description: "also mirror archived and long-dormant projects"
        type: boolean
        default: false
concurrency:
  group: mirror-sync
  cancel-in-progress: false
permissions:
  contents: write
env:
  # Must match the even-hour cron above.
  STALE_CRON: "17 0-22/2 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: setup-uv publishes no floating v9 tag
      # (v7 is the newest major alias), so @v9 fails to resolve.
      # No cache either: the project has no dependencies to restore.
      - uses: astral-sh/setup-uv@v9.0.0
      - run: echo "::add-mask::${{ secrets.GH_MIRROR_TOKEN }}"
      - name: Sync
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          uv run python -m sync \
            --limit "${{ inputs.limit || 450 }}" \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            --max-age-days "${{ inputs.max_age_days || 730 }}" \
            ${{ (inputs.include_stale || github.event.schedule == env.STALE_CRON) && '--include-stale' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit state
        if: always() && !inputs.dry_run
        run: |
          git config user.name "mirror-sync"
          git config user.email "mirror-sync@users.noreply.github.com"
          git diff --quiet state/refs.json && exit 0
          # Overlapping runs both rewrite the whole file, so rebasing hits a
          # content conflict every time. The conflict is spurious: state is a
          # cache keyed by project path, so union both sides instead of
          # picking a winner and losing a run's progress.
          cp state/refs.json /tmp/ours.json
          for i in 1 2 3 4 5; do
            git add state/refs.json
            git commit -qm "state: sync $(date -u +%FT%TZ)" || true
            git push && exit 0
            git fetch -q origin main
            git show origin/main:state/refs.json > /tmp/theirs.json
            git reset -q --hard origin/main
            uv run python -m sync.merge_state /tmp/ours.json /tmp/theirs.json state/refs.json
            git diff --quiet state/refs.json && exit 0
          done
          echo "::error::could not push state after 5 attempts"
          exit 1
