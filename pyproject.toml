[project]
name = "gitlab-sync"
version = "1.0.0"
description = "Mirror gitlab.manjaro.org projects into the manjaro-contrib GitHub org"
requires-python = ">=3.11"
# Intentionally empty: the tool is standard library only, so a sync run needs
# no resolution step and cannot break on a dependency release.
dependencies = []

# Not a distributable package -- `uv run python -m sync` runs it straight from
# the checkout. Declaring a build backend only pinned us to uv's release cadence
# (a <0.12 bound started warning the moment CI moved to uv 0.12) for a wheel
# nothing ever installs.
[tool.uv]
package = false
